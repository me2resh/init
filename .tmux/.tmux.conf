# https://github.com/seebi/tmux-colors-solarized/blob/master/tmuxcolors-256.conf
# Updated for tmux 3.x style syntax
set-option -g status-style bg=colour235,fg=colour136 #base02/yellow

# set window split
bind-key v split-window -h
bind-key b split-window

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=default #base0

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default #orange

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour240 #base01

# message text
set-option -g message-style bg=colour235,fg=colour166 #base02/orange

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange
# clock
set-window-option -g clock-mode-colour green #green


set -g status-interval 2
set -g status-justify centre # center align window list
set -g status-left-length 40
set -g status-right-length 160
set -g status-left '#[fg=green]#H #[fg=black]• #[fg=green,bright]#(uname -r | cut -c 1-6)#[default]'
# Status right: network bandwidth, mem/cpu, uptime, time, date
set -g status-right '#[fg=cyan]#(~/.tmux/scripts/bandwidth.sh)#[default] #[fg=green,bright]#(tmux-mem-cpu-load -a 0 2>/dev/null || echo "")#[default] #[fg=red,dim]#(uptime | cut -f 4-5 -d " " | cut -f 1 -d ",")#[default] #[fg=white]%a %l:%M %p#[default] #[fg=blue]%Y-%m-%d'

# C-b is not acceptable -- Vim uses it
set-option -g prefix C-b
bind-key C-a last-window

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Allows us to use C-a a <command> to send commands to a TMUX session inside 
# another TMUX session
bind-key a send-prefix

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Vi copypaste mode
set-window-option -g mode-keys vi
#bind-key -t vi-copy 'v' begin-selection
#bind-key -t vi-copy 'y' copy-selection
bind -Tcopy-mode C-r command-prompt -i -p'search up' "send -X search-backward-incremental '%%'"

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# set to main-horizontal, 60% height for main pane
bind m set-window-option main-pane-height 60\; select-layout main-horizontal

bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# auto window rename
set-window-option -g automatic-rename

# color
set -g default-terminal "screen-256color"

# status bar
#set-option -g status-utf8 on

# https://github.com/edkolev/dots/blob/master/tmux.conf
# Updates for tmux 1.9's current pane splitting paths.

# =============================================================================
# Mouse Support (full mouse support for tmux 2.1+)
# =============================================================================
set -g mouse on

# Enable mouse scrolling in copy mode
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Mouse-based text selection and copy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Double click to select word
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"

# Triple click to select line
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

# =============================================================================
# Fix pane_current_path on new window and splits
# =============================================================================
unbind c; bind c new-window -c "#{pane_current_path}"
unbind '"'; bind '"' split-window -v -c '#{pane_current_path}'
unbind v; bind v split-window -h -c "#{pane_current_path}"
unbind %; bind % split-window -h -c "#{pane_current_path}"

# =============================================================================
# TPM Plugins
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'           # Fuzzy search for sessions, windows, panes

# =============================================================================
# Plugin Configuration
# =============================================================================

# Continuum: automatic session save/restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'        # Save every 10 minutes

# Resurrect: persist more session data
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'    # Restore vim sessions
set -g @resurrect-strategy-nvim 'session'   # Restore neovim sessions
set -g @resurrect-processes 'vim nvim less more tail top htop ssh psql mysql'

# tmux-fzf: fuzzy search keybindings (prefix + F)
set -g @tmux-fzf-launch-key 'F'
TMUX_FZF_LAUNCH_KEY="F"
TMUX_FZF_ORDER="session|window|pane|command|keybinding|clipboard|process"

# =============================================================================
# Scrollback and History
# =============================================================================
set -g history-limit 50000                  # Increase scrollback buffer

# Search in scrollback with prefix + /
bind-key / copy-mode \; send-key ?

# =============================================================================
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'

