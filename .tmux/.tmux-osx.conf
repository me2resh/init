# macOS-specific tmux configuration
# https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard

# Note: reattach-to-user-namespace is no longer needed for tmux 2.6+
# Modern tmux works directly with macOS clipboard

# Use zsh as default shell
set-option -g default-shell /bin/zsh

# Clipboard integration (modern tmux 2.6+ method)
# Copy to system clipboard
bind-key C-c run-shell 'tmux save-buffer - | pbcopy'
bind-key C-v run-shell 'pbpaste | tmux load-buffer - \; paste-buffer -d'

# Vi copy mode bindings (tmux 2.4+ syntax)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Emacs copy mode binding
bind-key -T copy-mode M-w send-keys -X copy-pipe-and-cancel "pbcopy"

# Open URLs in default browser (requires urlview or extract_url)
bind-key u capture-pane \; save-buffer /tmp/tmux-buffer \; new-window -n "urlview" '$SHELL -c "urlview < /tmp/tmux-buffer || cat /tmp/tmux-buffer | grep -oE \"https?://[^ ]+\" | fzf --bind \"enter:execute(open {})\" "'
